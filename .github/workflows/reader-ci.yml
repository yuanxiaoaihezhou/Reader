name: Reader CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reader-changelog:
    name: validate-reader-changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test Reader changelog tooling
        run: python3 .github/scripts/test-reader-changelog.py

      - name: Validate PR changelog
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > /tmp/reader-pr-body.md
          python3 .github/scripts/reader-changelog.py validate --body-file /tmp/reader-pr-body.md

  build-debug-apk:
    name: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build unsigned-release-free Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAppDebug -PciMinifyDebug=true --build-cache --stacktrace --no-daemon

      - name: Check generated APK files
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: reader-debug-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
